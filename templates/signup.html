<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create account • Libra</title><link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}"><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head><body class="auth-page"><div class="auth-shell"><div class="auth-brand"><img src="{{ url_for('static', filename='favicon.svg') }}"><span>Libra</span></div><div class="auth-card"><p class="eyebrow">JOIN LIBRA</p><h1>Create your member profile.</h1><p class="muted">One account lets you borrow up to {{ max_books }} books and keep every deadline in view.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for cat,msg in messages %}<div class="flash {{cat}}">{{msg}}</div>{% endfor %}{% endwith %}<form method="post" class="auth-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Full name<input name="name" autocomplete="name" required placeholder="Your full name"></label><label>Email<input type="email" name="email" autocomplete="email" required placeholder="you@example.com"></label><label>Password<input type="password" name="password" autocomplete="new-password" minlength="6" required placeholder="At least 6 characters"></label><button class="button wide">Create account</button></form><p class="auth-switch">Already a member? <a href="{{ url_for('login') }}">Sign in</a></p></div></div></body></html>
