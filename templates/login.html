<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in • Libra</title><link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}"><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head><body class="auth-page"><div class="auth-shell"><div class="auth-brand"><img src="{{ url_for('static', filename='favicon.svg') }}"><span>Libra</span></div><div class="auth-card"><p class="eyebrow">WELCOME BACK</p><h1>Sign in to your library.</h1><p class="muted">Track borrowed books, exact due times and fines from one profile.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for cat,msg in messages %}<div class="flash {{cat}}">{{msg}}</div>{% endfor %}{% endwith %}<form method="post" class="auth-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Email<input type="email" name="email" autocomplete="email" required placeholder="you@example.com"></label><label>Password<input type="password" name="password" autocomplete="current-password" required placeholder="••••••••"></label><button class="button wide">Sign in</button></form><p class="auth-switch">New to Libra? <a href="{{ url_for('signup') }}">Create an account</a></p></div></div></body></html>
